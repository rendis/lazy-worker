[package]
name = "lazy-worker"
version = "0.6.7"
edition = "2021"
description = "Small desktop utilities for everyday work"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAppearance", "NSBezierPath", "NSColor", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSEnumerator", "NSGeometry", "NSLocale", "NSString"] }
plist = "1"
png = "0.18"
tauri = { version = "~2.12.7", features = ["tray-icon"] }
tauri-plugin-updater = "2.14.1"

[target.'cfg(unix)'.dependencies]
base64 = "0.22"
hkdf = "0.12"
hmac = "0.12"
# RustCrypto's spake2 has not had an independent audit.
spake2 = "0.4.0"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
