<!doctype html>
<html lang="en">
<head>

  <script src="assets/gsap.min.js"></script>

    <div id="caffeinate" class="clip" data-composition-id="caffeinate" data-composition-src="compositions/caffeinate.html"

    <div id="proxy" class="clip" data-composition-id="proxy" data-composition-src="compositions/proxy.html"
      data-start="15.2" data-duration="9.7" data-width="1920" data-height="1080" data-track-index="0" data-track-kind="graphics"></div>
  </main>
  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines.main = gsap.timeline({paused: true});
  </script>

</html>
